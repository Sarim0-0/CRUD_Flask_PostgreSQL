services:
  app:
    build: .  # Build from Dockerfile
    ports:
      - "5000:5000"  # Map port
    depends_on:
      - db  # Wait for DB
      - redis  # Wait for Redis
    environment:
      - DATABASE_URI=${DATABASE_URI}
      - REDIS_URL=${REDIS_URL}
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:13  # Postgres image
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data  # Persistent volume
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lin_flask"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine  # Redis image (lightweight)
    ports:
      - "6379:6379"  # Redis default port
    volumes:
      - redis-data:/data  # Persistent Redis data
    networks:
      - app-network
    command: redis-server --appendonly yes  # Enable persistence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  app-network:  # Internal network

volumes:
  db-data:  # PostgreSQL volume
  redis-data:  # Redis volume