name: Flask CI/CD Pipeline

on:
  push:
    branches: '**'
  pull_request:

env:
  AWS_REGION: ap-south-1

jobs:
  # -----------------------
  # 1️⃣ BUILD & INSTALL
  # -----------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installation
        run: python -m flask --version

  # -----------------------
  # 2️⃣ LINT / SECURITY SCAN
  # -----------------------
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install lint tools
        run: |
          pip install flake8 bandit
      - name: Run flake8 (Lint)
        run: flake8 --ignore=E501 .
      - name: Run Bandit (Security Scan)
        run: bandit -r app.py || true

  # -----------------------
  # 3️⃣ TEST (WITH POSTGRES)
  # -----------------------
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URI: postgresql+psycopg2://testuser:testpass@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest psycopg2-binary
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U testuser -d testdb; do
            echo "Waiting for database..."
            sleep 2
          done
      # Redis health check already ensures it's ready - no need for separate wait
      - name: Run tests
        run: pytest -v

  # -----------------------
  # 4️⃣ BUILD & PUSH DOCKER IMAGE
  # -----------------------
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/crud-flask-postgresql:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/crud-flask-postgresql:latest \
               ${{ secrets.DOCKER_USERNAME }}/crud-flask-postgresql:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/crud-flask-postgresql:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/crud-flask-postgresql:${{ github.sha }}

      - name: Show pushed images
        run: docker images ${{ secrets.DOCKER_USERNAME }}/crud-flask-postgresql

  # -----------------------
  # 5️⃣ TERRAFORM VALIDATE
  # -----------------------
  terraform-validate:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -no-color \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -out=tfplan
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: terraform-plan
          path: infra/tfplan

  # -----------------------
  # 6️⃣ TERRAFORM APPLY (Manual Approval)
  # -----------------------
  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.ref == 'refs/heads/main'
    environment: 
      name: production
      url: http://${{ steps.tf-outputs.outputs.ec2_ip }}:5000
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT

      - name: Save Terraform Outputs
        run: |
          terraform output -json > terraform-outputs.json
          cat terraform-outputs.json

      - name: Display Deployment Info
        run: |
          echo "🚀 Deployment Complete!"
          echo "EC2 Public IP: ${{ steps.tf-outputs.outputs.ec2_ip }}"
          echo "RDS Endpoint: ${{ steps.tf-outputs.outputs.rds_endpoint }}"
          echo "App URL: http://${{ steps.tf-outputs.outputs.ec2_ip }}:5000"

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v3
        with:
          name: terraform-outputs
          path: infra/terraform-outputs.json