<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CRUD Operations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .form-section h2 {
            color: #764ba2;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-update {
            background: #ffc107;
            color: #333;
        }
        
        .btn-update:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        
        .btn-view {
            background: #28a745;
            color: white;
        }
        
        .btn-view:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .table-section {
            margin-top: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        thead {
            background: #667eea;
            color: white;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .home-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .home-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .home-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 User Management System</h1>
        <p class="subtitle">Flask + PostgreSQL CRUD Operations</p>
        
        <div id="message" class="message"></div>
        
        <!-- Create/Update Form -->
        <div class="form-section">
            <h2 id="form-title">➕ Add New User</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter user name">
                </div>
                
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required placeholder="Enter user age">
                </div>
                
                <button type="submit" class="btn btn-primary" id="submitBtn">Add User</button>
                <button type="button" class="btn btn-update" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel</button>
            </form>
        </div>
        
        <!-- Users Table -->
        <div class="table-section">
            <h2>📋 All Users</h2>
            <button class="btn btn-primary" onclick="loadUsers()" style="margin-bottom: 15px;">🔄 Refresh</button>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr>
                        <td colspan="4" style="text-align: center;">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        // Load users when page loads
        window.onload = function() {
            loadUsers();
        };

        // Handle form submission
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            
            if (userId) {
                updateUser(userId, name, age);
            } else {
                createUser(name, age);
            }
        });

        // CREATE - Add new user
        function createUser(name, age) {
            fetch('/data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name: name, age: age })
            })
            .then(response => response.json())
            .then(data => {
                showMessage('✅ User added successfully!', 'success');
                resetForm();
                loadUsers();
            })
            .catch(error => {
                showMessage('❌ Error adding user: ' + error, 'error');
            });
        }

        // READ - Load all users
        function loadUsers() {
            fetch('/data')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('userTable');
                
                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No users found</td></tr>';
                    return;
                }
                
                tableBody.innerHTML = '';
                data.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.age}</td>
                        <td>
                            <div class="btn-group">
                                <button class="btn btn-view btn-small" onclick="viewUser('${user.id}')">👁️ View</button>
                                <button class="btn btn-update btn-small" onclick="editUser('${user.id}', '${user.name}', '${user.age}')">✏️ Edit</button>
                                <button class="btn btn-delete btn-small" onclick="deleteUser('${user.id}')">🗑️ Delete</button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                showMessage('❌ Error loading users: ' + error, 'error');
            });
        }

        // READ - View single user
        function viewUser(id) {
            fetch(`/data/${id}`)
            .then(response => response.json())
            .then(user => {
                alert(`User Details:\n\nID: ${user.id}\nName: ${user.name}\nAge: ${user.age}`);
            })
            .catch(error => {
                showMessage('❌ Error viewing user: ' + error, 'error');
            });
        }

        // UPDATE - Edit user
        function editUser(id, name, age) {
            document.getElementById('userId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('age').value = age;
            document.getElementById('form-title').textContent = '✏️ Update User';
            document.getElementById('submitBtn').textContent = 'Update User';
            document.getElementById('submitBtn').className = 'btn btn-update';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            
            // Scroll to form
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUser(id, name, age) {
            fetch(`/data/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name: name, age: age })
            })
            .then(response => response.json())
            .then(data => {
                showMessage('✅ User updated successfully!', 'success');
                resetForm();
                loadUsers();
            })
            .catch(error => {
                showMessage('❌ Error updating user: ' + error, 'error');
            });
        }

        // DELETE - Remove user
        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                fetch(`/data/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    showMessage('✅ User deleted successfully!', 'success');
                    loadUsers();
                })
                .catch(error => {
                    showMessage('❌ Error deleting user: ' + error, 'error');
                });
            }
        }

        // Reset form
        function resetForm() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('form-title').textContent = '➕ Add New User';
            document.getElementById('submitBtn').textContent = 'Add User';
            document.getElementById('submitBtn').className = 'btn btn-primary';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
